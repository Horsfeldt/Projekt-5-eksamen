<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css"/>
    <link rel="stylesheet" href="stylesheet/index.css" />
    <link rel="stylesheet" href="stylesheet/forside.css" />
  </head>
  <body>
    <header>
      <div class="blaaboks">
        <p>
          SelfBack er blevet anbefalet af Lægemiddelstyrelsen i Nævnet for
          Sundhedapps!
          <a
            href="https://www.sundhed.dk/borger/sygdom-og-behandling/om-sundhedsvaesenet/anbefalede-sundhedsapps/"
            >Klik for at læse mere</a
          >
        </p>
      </div>

      <nav class="navbar">
        <i class="las la-bars"></i>
        <img class="logoSelfBack" src="img/darklogo_SelfBack.png" alt="logo" />
        <img class="flag" src="img/flagDk.webp" alt="dansk flag" />
      </nav>
    </header>

    <main>
      <div class="main-content">
          <h2>Hvem er du?</h2>

            <button>
              <div class="forsideBoks" >
                <img class="forsideIcon" src="img/patientIcon.png" alt="Patient icon" />
                <p><strong>Patient</strong></p>
                <p>Er du rygpatient og vil læse mere om SelfBack?</p>
              </div>
            </button>

            <button>
              <div class="forsideBoks" >
                <img class="forsideIcon" src="img/kilinikpersonaleIcon.png" alt="Klinikpersonale icon" />
                <p><strong>Klinikpersonale</strong></p>
                <p>Er du ansat i en lægeklinik og vil læse mere om vejledning på SelfBack?</p>
              </div>
            </button>


            <button>
              <div class="forsideBoks" >
                <img class="forsideIcon" src="img/lægeIcon.png" alt="Læge icon" />
                <p><strong>Læge</strong></p>
                <p>Er du læge og vil læse mere om henvisning til SelfBack?</p>
              </div>
            </button>


     </div>
      

    <footer>
      <div class="footer-content">
        <div class="div-column1">
          <img
            class="logoSelfBack"
            src="img/lightlogo_SelfBack.png"
            alt="logo"
          />

          <div class="social-icons">
            <i class="lab la-linkedin"></i>
            <i class="lab la-facebook-square"></i>
            <img class="CEikon" src="img/CEikon.png" alt="C E Mærke" />
          </div>
        </div>

        <div class="div-column2">
          <p>
            <strong>Firma</strong> <br />
            Om SelfBack <br />
            Kontakt SelfBack <br />
            Info
          </p>
          <p>
            <strong>Ressourcer</strong> <br />
            SelfBack Publikationer <br />
            SOME Ressourcer
          </p>
          <p>
            <strong>App</strong> <br />
            FAQ <br />
            Få SelfBack <br />
            Tilgængelighedserklæring
          </p>
          <p>
            <strong>Site</strong> <br />
            Privatlivspolitik <br />
            Cookies
          </p>
        </div>
      </div>
    </footer>
  </body>
</html>
